# Quick checks on your own machine before each commit: `uv run pre-commit install` once, then
# every commit runs these on the files it touches. The same checks run on GitHub (tests.yml).
# Line endings are git's job (.gitattributes), not a hook's. Third-party licence texts stay verbatim.
exclude: ^(packaging/licenses/|LICENSE$)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check   # the linter (ruff's formatter is not switched on yet)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
