name: Release build

# Builds Ironbark for Windows the way packaging/windows/build.ps1 does on a PC: the tests,
# PyInstaller, the built program's --self-check (a failure stops the build), the licence check,
# the Inno Setup installer (when the runner has Inno Setup 6), the portable zip and SHA-256
# checksums. The files are kept as this run's artifacts to download; nothing is signed or
# published from here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # a "Run workflow" button on GitHub's Actions tab
    inputs:
      skip_tests:
        # A build to try out (the quick tier has run the tests on this commit already). The full
        # suite's window-layout tests can fail on the runner's display scaling, which would stop
        # the build before anything is packaged. The built program's --self-check still runs.
        description: "Skip the tests (a build to try out)"
        type: boolean
        default: false
      prerelease:
        # A test build anyone can download without signing in: published as a GitHub pre-release
        # (never "latest", so the README's download link still means the last real release), under
        # this tag. Not "v…": that would start a tag build of its own.
        description: "Publish as a public pre-release with this tag (e.g. test-2026-10-20); empty: none"
        type: string
        default: ""
      prerelease_notes:
        description: "What the pre-release is for (its notes)"
        type: string
        default: "A test build, not a release."

permissions:
  contents: read

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Actions are pinned to a commit (a tag can be moved to other code); the comment says which release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0
      # Built with python.org's Python, as on a PC: left to itself uv fetches its own build of Python,
      # which carries other DLLs (the C runtime, OpenSSL under other names, zlib) that the licence check
      # rightly stops at. The runner's tool cache holds python.org's builds.
      - name: python.org's Python 3.12 (from the runner's tool cache)
        shell: pwsh
        run: |
          $found = Get-ChildItem "$env:RUNNER_TOOL_CACHE\Python\3.12.*\x64\python.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $found) { throw "No python.org Python 3.12 in the runner's tool cache" }
          & $found.FullName --version
          "UV_PYTHON=$($found.FullName)" >> $env:GITHUB_ENV
          "UV_PYTHON_PREFERENCE=only-system" >> $env:GITHUB_ENV
      - name: Build (tests, package, self-check, installer, zip, checksums)
        shell: pwsh
        run: |
          # Only Python, uv, PowerShell and Windows' own folders on the path: the runner's PATH holds many
          # tools whose DLLs (the C runtime, OpenSSL, zlib) PyInstaller would otherwise bundle, which a PC
          # build doesn't, and the licence check rightly stops at.
          $env:PATH = @((Split-Path $env:UV_PYTHON), (Join-Path (Split-Path $env:UV_PYTHON) "Scripts"),
            (Split-Path (Get-Command uv).Source), (Split-Path (Get-Command pwsh).Source),
            "$env:SystemRoot\System32", $env:SystemRoot, "$env:SystemRoot\System32\Wbem",
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0") -join ";"
          if ("${{ inputs.skip_tests }}" -eq "true") { packaging\windows\build.ps1 -SkipTests }
          else { packaging\windows\build.ps1 }
      - name: Where the unlisted DLLs come from (only when the build failed)
        if: failure()
        shell: pwsh
        run: |
          "Python's own DLLs:"; Get-ChildItem (Join-Path (Split-Path $env:UV_PYTHON) "DLLs") -Filter *.dll | ForEach-Object Name
          foreach ($name in "libcrypto-3.dll", "libssl-3.dll", "zlib1.dll", "ucrtbase.dll", "api-ms-win-crt-runtime-l1-1-0.dll") {
            "${name}:"
            $env:PATH -split ";" | Where-Object { $_ -and (Test-Path (Join-Path $_ $name)) } | ForEach-Object { "  $_" }
          }
          "Bundled DLLs:"; Get-ChildItem dist\windows\Ironbark\_internal -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName.Substring((Resolve-Path dist\windows\Ironbark\_internal).Path.Length + 1) }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: ironbark-windows
          path: |
            dist/windows/Ironbark-*.exe
            dist/windows/Ironbark-*-windows-portable.zip
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish the test build (pre-release)
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # (the release)
      actions: read     # (the build's files, from this run)
    steps:
      - name: The build's files as a public pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          TAG: ${{ inputs.prerelease }}
          NOTES: ${{ inputs.prerelease_notes }}
        run: |
          case "$TAG" in v*) echo "A tag starting with v would start a release build of its own"; exit 1;; esac
          gh run download "$RUN" -R "$REPO" -n ironbark-windows -D dist
          ls -l dist
          gh release create "$TAG" dist/* -R "$REPO" --prerelease --target "$SHA" \
            --title "Ironbark test build $TAG (not a release)" --notes "$NOTES"
