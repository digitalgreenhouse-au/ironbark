name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:   # a "Run workflow" button on GitHub's Actions tab

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0   # full version: setup-uv publishes no short "v10" name
      - name: Install (exactly as locked)
        run: uv sync --locked
      - name: Run the tests
        run: uv run pytest -q
