name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:   # a "Run workflow" button on GitHub's Actions tab

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to a commit (a tag can be moved to other code); the comment says which release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0
      - name: Install (exactly as locked)
        run: uv sync --locked
      - name: Run the tests
        run: uv run pytest -q
