name: Feature idea
description: Suggest something new.
labels: [feature]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like Ironbark to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What problem does it solve for you, or how do you do it today?
