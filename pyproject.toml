[project]
name = "ironbark-player"
dynamic = ["version"]  # from ironbark/__init__.py
description = "Ironbark: a lossless music player that proves bit-perfect playback, by Digital Greenhouse."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Digital Greenhouse", email = "info@digitalgreenhouse.com.au" }]
requires-python = ">=3.11"
dependencies = [
    "comtypes>=1.4.8; sys_platform == 'win32'",   # used directly (media controls, devices), not only via pycaw
    "numpy>=1.26",
    "pillow>=10",
    "pycaw>=20260927; sys_platform == 'win32'",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "tkinterdnd2>=0.6.3",
]

[project.gui-scripts]
ironbark = "ironbark.__main__:main"
dg-flac-player = "ironbark.__main__:main"   # the old command still works

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4",
    "pre-commit>=4.6.2",
    "pyinstaller>=6.22.3",
    "pytest>=8",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ironbark/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ironbark"]

[tool.pytest.ini_options]
# Two tiers. The quick tier is every test that makes no window: `uv run pytest -q -m "not ui"`
# (a few minutes). The whole suite, windows and all, is `uv run pytest -q` (see tests/conftest.py,
# which marks the window tests `ui` itself). Benchmarks (`perf`) run only with --perf.
addopts = "-p no:cacheprovider"
markers = [
    "ui: makes a window (tkinter): the slow tier; `-m \"not ui\"` is the quick one",
    "perf: a performance benchmark (slow); runs only with --perf",
]

[tool.ruff]
# `uv run ruff check` (the linter only; the formatter is not switched on yet). Line length matches
# the code as written; long lines are not an error (E501), since the wording in prompts and
# messages is more important than the column.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]   # pycodestyle, pyflakes, bugbear, import order, pyupgrade
ignore = [
    "E501",   # line too long: see above
    "E741",   # ambiguous names like `l`: left as written for now
    "B023",   # a function that uses a loop variable: common in Tk callbacks, bound on purpose
    "B905",   # zip() without strict=: not wanted everywhere
    "UP031", "UP032",   # %-formatting and .format(): left where they read better
]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported and then named as arguments (F811); a bare expression inside
# pytest.raises is the point of the test (B018); a constant default like math.sqrt(2) is fine (B008)
"tests/*" = ["F811", "B018", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["ironbark"]

# Which module may import which: `uv run lint-imports` (import-linter; CI runs it on every push).
# tests/test_architecture.py checks the same rules, with the full list of modules that may use the
# window toolkit, in the quick tier.
[tool.importlinter]
root_package = "ironbark"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The Check tools import from the core, never the main window"
type = "forbidden"
source_modules = ["ironbark.tools"]
forbidden_modules = ["ironbark.ui"]

[[tool.importlinter.contracts]]
name = "The main window is imported only by the entry point and the self-check"
type = "protected"
protected_modules = ["ironbark.ui"]
allowed_importers = ["ironbark.__main__", "ironbark.selfcheck"]

[[tool.importlinter.contracts]]
name = "The engine, the readers, the library database and the network cache know nothing of the window, the tools or the toolkit"
type = "forbidden"
source_modules = [
    "ironbark.engine", "ironbark.session", "ironbark.audiofile", "ironbark.library", "ironbark.library_db",
    "ironbark.library_sql", "ironbark.library_import", "ironbark.indexer",
    "ironbark.tagio", "ironbark.netcache", "ironbark.analysis", "ironbark.loudness", "ironbark.proof",
    "ironbark.devices", "ironbark.settings", "ironbark.places", "ironbark.musicfiles", "ironbark.passthrough",
]
forbidden_modules = [
    "ironbark.ui", "ironbark.tools", "ironbark.toolwin", "ironbark.controls", "ironbark.tabbar",
    "ironbark.popups", "ironbark.theme", "tkinter",
]

[[tool.importlinter.contracts]]
name = "The tag code is self-contained"
type = "forbidden"
source_modules = ["ironbark.tagio"]
forbidden_modules = [
    "ironbark.engine", "ironbark.audiofile", "ironbark.library", "ironbark.library_db", "ironbark.settings",
    "ironbark.netcache", "ironbark.analysis", "ironbark.ui", "ironbark.tools",
]

# Type checking: `uv run mypy` (CI runs it on every push). Gradual: `files` lists the modules that are
# clean; add a module once it is. Next in line (errors at 0.42.0): tagio/mpeg.py (43), tagio/ogg.py (29),
# netcache/manager.py (52). Modules a listed one imports are read but not reported (follow_imports).
[tool.mypy]
python_version = "3.11"
platform = "win32"   # checked as Windows wherever it runs (a CI runner is Linux): the Windows-only branches are typed against Windows
files = [
    "ironbark/tagio/__init__.py", "ironbark/tagio/_files.py", "ironbark/tagio/flac.py", "ironbark/tagio/genres.py",
    "ironbark/tagio/id3.py", "ironbark/tagio/mp4.py", "ironbark/tagio/riff.py", "ironbark/tagio/vorbis.py",
    "ironbark/netcache/__init__.py", "ironbark/netcache/fetch.py", "ironbark/netcache/growing.py",
    "ironbark/netcache/netwatch.py", "ironbark/netcache/policy.py", "ironbark/netcache/sources.py",
    "ironbark/netcache/store.py", "ironbark/netcache/verify.py",
]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
disable_error_code = ["annotation-unchecked"]   # (notes about unannotated functions: gradual means gradual)
